name: Publish container images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-images.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "infra/nginx/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/setcodes/performancelab-web
  MARTIN_IMAGE: ghcr.io/setcodes/performancelab-martin
  POSTGIS_IMAGE: ghcr.io/setcodes/performancelab-postgis

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror Martin image
        run: |
          docker buildx imagetools create \
            --tag "${MARTIN_IMAGE}:1.3.1" \
            ghcr.io/maplibre/martin:1.3.1

      - name: Mirror PostGIS image
        run: |
          docker buildx imagetools create \
            --tag "${POSTGIS_IMAGE}:17-3.5" \
            postgis/postgis:17-3.5

